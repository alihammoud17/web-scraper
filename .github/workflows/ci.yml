name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Real Redis, Postgres and RabbitMQ for the [RedisFact] / [PostgresFact] / [RabbitFact] integration tests
    # (Lua token bucket, ON CONFLICT upserts, quorum queues, TTL tiers, dead-lettering, redelivery).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4
        env:
          # RabbitMQ's default guest user may only connect from localhost inside its container.
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      # Installs exactly the SDK pinned in global.json, so CI and local builds match.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build
        env:
          SCRAPER_TEST_REDIS: localhost:6379
          SCRAPER_TEST_POSTGRES: Host=localhost;Port=5432;Username=test;Password=test;Database=test
          SCRAPER_TEST_RABBITMQ: amqp://test:test@localhost:5672/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # The placeholders are enough to validate the file and build the images; nothing is deployed.
      - name: Create .env from the example
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build
